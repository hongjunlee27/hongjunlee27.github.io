name: Update and deploy conferences

on:
  push:
    branches: [main]
  schedule:
    # Every Friday at 09:17 Korea time (00:17 UTC)
    - cron: '17 0 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-conference-updates
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python for scheduled searches
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies for scheduled searches
        if: github.event_name != 'push'
        run: python -m pip install -r scripts/requirements-conferences.txt
      - name: Search and update archive
        if: github.event_name != 'push'
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python scripts/update_conferences.py
      - name: Commit new data if changed
        if: github.event_name != 'push'
        run: |
          git add conferences/events.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update conference archive"
          git push
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
